name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '.changeset/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node-version: [24.13.0]

    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

    - name: Setup pnpm
      uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2.4.1
      with:
        version: 9.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.13.0'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts

    - name: Check tsconfig references
      run: pnpm run check:references

    - name: Build project
      run: pnpm run build

    - name: Check Report build feedback loop
      run: pnpm run check:report-build-feedback-loop

    - name: Type check tests
      run: pnpm run type-check:tests

    - name: Run tests with coverage
      run: pnpm run test:coverage

    - name: Upload coverage reports
      id: upload-coverage
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage
        path: coverage
        if-no-files-found: ignore

    - name: Write coverage summary
      if: always()
      env:
        COVERAGE_ARTIFACT_URL: ${{ steps.upload-coverage.outputs.artifact-url }}
      run: node scripts/github-coverage-summary.js
